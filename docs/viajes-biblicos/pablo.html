    d:'Los hermanos los reciben con gozo. Pablo cuenta a Jacobo y a los ancianos lo que Dios había hecho entre los gentiles, y entrega la ofrenda de las iglesias (Ro 15:25-26; Hch 24:17).',
    q:{ p:'¿Qué usó Agabo para ilustrar su profecía?', o:['El cinto de Pablo','Un yugo de madera','Una vasija rota'], r:0 } },

{ nombre:'Viaje a Roma', anio:'c. 57–62 d.C.', ref:'Hechos 21:27–28:31', color:'#6b3fa0',

  { n:'Antípatris', ll:[32.105,34.93], ref:'Hechos 23:23-32', t:'Escolta nocturna',

  { n:'Cesarea', ll:CES, ref:'Hechos 23:33–26:32', t:'Dos años preso',

    dato:'Agripa concluye: «Podía este hombre ser puesto en libertad, si no hubiera apelado a César».',
    q:{ p:'¿A quién apeló Pablo para ser juzgado?', o:['Al Sanedrín','A César','Al rey Agripa'], r:1 } },
  { n:'Sidón', ll:[33.56,35.37], mar:1, ref:'Hechos 27:1-3', t:'Zarpan hacia Italia',

  { n:'Mira de Licia', ll:[36.26,29.985], mar:1, via:[[35.9,34.7],[36.0,32.5]], ref:'Hechos 27:4-6', t:'Cambio de nave',

  { n:'Gnido', ll:[36.686,27.375], mar:1, via:[[36.1,29.5],[36.52,28.25],[36.5,27.9]], ref:'Hechos 27:7', t:'Viento en contra',

  { n:'Buenos Puertos (Creta)', ll:[34.93,24.80], mar:1, via:[[35.3,26.4],[34.9,26.0]], ref:'Hechos 27:8-12', t:'La advertencia ignorada',
    d:'Pasan frente al cabo Salmón y llegan a Buenos Puertos, cerca de Lasea. Ya era peligroso navegar. Pablo advierte del desastre, pero el centurión hace más caso al piloto y al patrón.',
    dato:'Años después Pablo dejará a Tito en Creta para establecer ancianos en cada ciudad (Tit 1:5).' },
  { n:'La tormenta (Euroclidón)', lb:'Cauda', ll:[34.75,23.9], mar:1, ref:'Hechos 27:13-38', t:'Catorce noches a la deriva',

    dato:'Iban 276 personas a bordo. Pablo, el preso, termina dirigiendo: da gracias a Dios delante de todos, parte el pan y los anima a comer.',
