const VIAJES = [
{ nombre:'Infancia', anio:'c. 5 a.C. – 8 d.C.', ref:'Mateo 1–2 · Lucas 1–2', color:'#d1901a',

    d:'Un edicto de César Augusto obliga a José a empadronarse en la ciudad de David. Allí María da a luz y acuesta al niño en un pesebre, porque no había lugar en el mesón. Unos pastores reciben el anuncio de los ángeles.',

    dato:'Ofrecen dos tórtolas o palominos: la ofrenda permitida a los pobres (Lv 12:8).' },
  { n:'Belén', ll:BEL, ref:'Mateo 2:1-12', t:'Los magos de oriente',
    d:'Unos magos llegan a Jerusalén preguntando por el rey de los judíos. Herodes se turba. La estrella los guía hasta la casa donde está el niño; se postran, lo adoran y le ofrecen oro, incienso y mirra.',
    dato:'Mateo dice que lo hallaron en una «casa» (2:11): ya no en el pesebre. La Biblia no dice que fueran tres ni que fueran reyes.' },
  { n:'Egipto', ll:[31.04,32.55], via:[[31.5,34.47],[31.1,33.8]], ref:'Mateo 2:13-18', t:'La huida',
    d:'Un ángel avisa a José en sueños: Herodes busca al niño para matarlo. Huyen de noche. Herodes manda matar a todos los niños menores de dos años en Belén y sus alrededores.',

    dato:'Los evangelios no dicen en qué lugar de Egipto estuvieron; el punto en el mapa es solo orientativo.' },
  { n:'Nazaret', ll:NAZ, via:[[31.1,33.8],[31.5,34.47],[32.5,34.9]], ref:'Mateo 2:19-23', t:'El regreso',

  { n:'Jerusalén (templo)', lb:'Jerusalén', ll:TEMPLO, via:[GINEA,SICAR], ref:'Lucas 2:41-52', t:'A los doce años',

{ nombre:'Comienzo', anio:'c. 27 d.C.', ref:'Mateo 3–4 · Juan 1–4', color:'#1fa37a',
  resumen:'A los treinta años Jesús es bautizado, vence la tentación y se da a conocer. Su primer año transcurre entre Judea, Samaria y Galilea.',
  paradas:[
  { n:'Nazaret', ll:NAZ, ref:'Lucas 2:51-52 · Marcos 6:3', t:'Los años ocultos',
    d:'Casi treinta años de vida ordinaria: crecía en sabiduría, en estatura y en gracia. Era conocido como «el carpintero».',
    dato:'De la mayor parte de la vida de Jesús no sabemos casi nada: obediencia silenciosa en un taller.' },
  { n:'Río Jordán', ll:JORDAN, via:VALLE, ref:'Mateo 3:13-17', t:'El bautismo',
    d:'Juan se resiste, pero Jesús insiste: «así conviene que cumplamos toda justicia». Al subir del agua, el Espíritu desciende como paloma y una voz dice: «Este es mi Hijo amado, en quien tengo complacencia».',
    ig:'Isaías 40:3: Juan es la voz que clama en el desierto preparando el camino del Señor. Isaías 42:1: el Siervo sobre quien Dios pone su Espíritu.',
    dato:'Padre, Hijo y Espíritu Santo se manifiestan a la vez. Jesús tenía unos treinta años (Lc 3:23).' },
  { n:'Desierto de Judea', ll:[31.87,35.43], ref:'Mateo 4:1-11', t:'La tentación',
    d:'Llevado por el Espíritu, ayuna cuarenta días y es tentado por el diablo tres veces. Las tres responde: «Escrito está».',
    dato:'Las tres respuestas son de Deuteronomio (8:3; 6:16; 6:13). Donde Israel cayó en el desierto, Jesús obedeció.',
    q:{ p:'¿Con qué respondió Jesús a cada tentación?', o:['Con un milagro','Con la Escritura','Con silencio'], r:1 } },
  { n:'Betania del Jordán', lb:'', ll:JORDAN, ref:'Juan 1:29-51', t:'«He aquí el Cordero de Dios»',
    d:'Juan el Bautista lo señala: «el Cordero de Dios, que quita el pecado del mundo». Dos de sus discípulos siguen a Jesús; pronto se suman Andrés, Simón Pedro, Felipe y Natanael.',
    dato:'Jesús cambia el nombre a Simón: Cefas, «piedra».' },
  { n:'Caná de Galilea', lb:'Caná', ll:CANA, via:[[32.0,35.53],[32.5,35.56]], ref:'Juan 2:1-11', t:'El agua en vino',
    d:'En una boda se acaba el vino. Jesús manda llenar de agua seis tinajas de piedra y el agua se convierte en vino mejor que el primero.',
    dato:'«Este principio de señales hizo Jesús… y manifestó su gloria; y sus discípulos creyeron en él».' },
  { n:'Jerusalén', ll:TEMPLO, via:[CAP,[32.5,35.56],JERICO], ref:'Juan 2:13 – 3:21', t:'La primera Pascua y Nicodemo',
    d:'Tras unos días en Capernaum sube a la Pascua. Echa del templo a los mercaderes: «Destruid este templo, y en tres días lo levantaré». De noche lo visita Nicodemo: «el que no naciere de nuevo, no puede ver el reino de Dios».',
    ig:'Salmo 69:9: «El celo de tu casa me consume» (Jn 2:17).',
    dato:'En esa conversación está Juan 3:16.' },
  { n:'Sicar (Samaria)', lb:'Sicar', ll:SICAR, ref:'Juan 4:1-42', t:'La mujer samaritana',
    d:'Cansado del camino, se sienta junto al pozo de Jacob y pide agua a una mujer samaritana. Le ofrece agua viva, le descubre su vida y se revela: «Yo soy, el que habla contigo». Muchos samaritanos creen.',
    dato:'Los judíos evitaban Samaria, pero a Jesús «le era necesario pasar» por allí. Los samaritanos lo confiesan «el Salvador del mundo».',
    q:{ p:'¿Junto a qué pozo habló Jesús con la samaritana?', o:['El pozo de Jacob','El pozo de Belén','El estanque de Siloé'], r:0 } },
  { n:'Caná de Galilea', lb:'Caná', ll:CANA, via:[GINEA], ref:'Juan 4:46-54', t:'Sanidad a distancia',
    d:'Un oficial del rey le ruega por su hijo, que agoniza en Capernaum. «Ve, tu hijo vive». El hombre creyó la palabra, y a esa misma hora la fiebre lo dejó.',
    dato:'Juan la cuenta como la segunda señal. Capernaum está a unos 25 km.' },
  { n:'Nazaret', ll:NAZ, ref:'Lucas 4:16-30', t:'Rechazado en su tierra',
    d:'En la sinagoga lee al profeta Isaías y declara: «Hoy se ha cumplido esta Escritura delante de vosotros». Cuando les recuerda la gracia de Dios a gentiles como la viuda de Sarepta y Naamán, se llenan de ira y quieren despeñarlo.',
    ig:'Isaías 61:1-2: «El Espíritu del Señor está sobre mí, por cuanto me ha ungido para dar buenas nuevas a los pobres».',
    dato:'«Ningún profeta es acepto en su propia tierra».' },
]},

{ nombre:'Galilea', anio:'c. 28–29 d.C.', ref:'Mateo 4–18 · Marcos 1–9 · Lucas 4–9', color:'#2b8fd6',
  resumen:'El grueso de su ministerio público: enseña con autoridad, sana, echa fuera demonios y forma a los doce, casi todo alrededor del mar de Galilea.',
  paradas:[
  { n:'Capernaum', ll:CAP, ref:'Mateo 4:13-22 · Marcos 1:21 – 2:12', t:'Su ciudad',
    d:'Deja Nazaret y se establece junto al mar. Llama a Pedro, Andrés, Jacobo y Juan: «os haré pescadores de hombres». Enseña en la sinagoga con autoridad, sana a la suegra de Pedro y perdona y levanta a un paralítico bajado por el techo. Llama a Mateo, el publicano.',
    ig:'Isaías 9:1-2: en Galilea de los gentiles, «el pueblo asentado en tinieblas vio gran luz».',
    dato:'Al paralítico le dice primero «tus pecados te son perdonados»: la sanidad demuestra que tiene potestad para perdonar.' },
  { n:'Monte de las Bienaventuranzas', lb:'Sermón del monte', ll:[32.881,35.556], ref:'Mateo 5–7 · Lucas 6:12-16', t:'El Sermón del monte',
    d:'Tras pasar la noche orando, escoge a los doce apóstoles. Sentado en el monte, enseña: las bienaventuranzas, la sal y la luz, «oísteis que fue dicho… pero yo os digo», el Padrenuestro, la puerta estrecha, la casa sobre la roca.',
    dato:'«No he venido para abrogar la ley, sino para cumplirla» (5:17). La gente se admiraba porque enseñaba como quien tiene autoridad. La ubicación es tradicional.',
    q:{ p:'¿Qué hizo Jesús antes de escoger a los doce?', o:['Ayunó cuarenta días','Pasó la noche orando','Subió a Jerusalén'], r:1 } },
  { n:'Naín', ll:[32.631,35.349], ref:'Lucas 7:11-17', t:'El hijo de la viuda',
    d:'Se cruza con un cortejo fúnebre: el hijo único de una viuda. Se compadece de ella, toca el féretro y dice: «Joven, a ti te digo, levántate». Y lo dio a su madre.',
    dato:'Nadie se lo pidió: la iniciativa fue enteramente de su compasión.' },
  { n:'Mar de Galilea', ll:[32.83,35.60], mar:1, via:[CAP], ref:'Marcos 4:35-41', t:'Calma la tempestad',
    d:'Cruzando el lago se levanta una gran tempestad. Jesús duerme en la popa. Lo despiertan: «¿no tienes cuidado que perecemos?». Reprende al viento y dice al mar: «Calla, enmudece».',
    dato:'Los discípulos temen más después que antes: «¿Quién es este, que aun el viento y el mar le obedecen?»' },
  { n:'Región de los gadarenos', lb:'Gadarenos', ll:[32.826,35.650], mar:1, ref:'Marcos 5:1-20', t:'El endemoniado «Legión»',
    d:'Un hombre que vivía entre los sepulcros, al que nadie podía dominar, corre y se postra. Jesús echa fuera a los demonios, que entran en unos dos mil cerdos y se precipitan al mar. El hombre queda sentado, vestido y en su juicio cabal.',
    dato:'Quiso irse con Jesús, pero fue enviado a los suyos: «cuéntales cuán grandes cosas el Señor ha hecho contigo». Fue el primer testigo en Decápolis.' },
  { n:'Capernaum', ll:CAP, mar:1, ref:'Marcos 5:21-43', t:'La hija de Jairo',
    d:'Jairo, principal de la sinagoga, le ruega por su hija moribunda. En el camino, una mujer enferma desde hacía doce años toca su manto y queda sana. La niña muere, pero Jesús la toma de la mano: «Talita cumi».',
    dato:'«No temas, cree solamente». La niña tenía doce años: los mismos que la mujer llevaba enferma.' },
  { n:'Betsaida', ll:[32.910,35.631], ref:'Lucas 9:10-17 · Juan 6:1-15', t:'Alimenta a cinco mil',
    d:'En un lugar desierto, con cinco panes de cebada y dos pececillos de un muchacho, da de comer a cinco mil hombres. Sobran doce cestas. La multitud quiere hacerlo rey por la fuerza, y él se retira al monte, solo.',
    dato:'Aparte de la resurrección, es el único milagro narrado en los cuatro evangelios.',
    q:{ p:'¿Cuántas cestas sobraron?', o:['Siete','Doce','Ninguna'], r:1 } },
  { n:'Capernaum', ll:CAP, mar:1, via:[[32.86,35.60]], ref:'Mateo 14:22-33 · Juan 6:22-71', t:'Sobre el mar, y el Pan de vida',
    d:'De madrugada va hacia la barca andando sobre el mar; Pedro camina hacia él y se hunde al dudar. Al día siguiente, en la sinagoga: «Yo soy el pan de vida». Muchos discípulos se escandalizan y dejan de seguirlo.',
    dato:'«Ninguno puede venir a mí, si el Padre que me envió no le trajere» (Jn 6:44). Pedro: «Señor, ¿a quién iremos? Tú tienes palabras de vida eterna».' },
  { n:'Región de Tiro y Sidón', lb:'Tiro', ll:[33.27,35.20], ref:'Marcos 7:24-30', t:'La fe de una extranjera',
    d:'Una mujer sirofenicia le ruega por su hija endemoniada y persevera aun ante la aparente negativa: «aun los perrillos comen de las migajas». «Oh mujer, grande es tu fe».',
    dato:'Es la única salida de Jesús fuera de la tierra de Israel durante su ministerio.' },
  { n:'Decápolis', ll:[32.779,35.66], via:[[33.56,35.37],[33.25,35.7],[32.9,35.75]], ref:'Marcos 7:31 – 8:10', t:'«Efata» y los cuatro mil',
    d:'Vuelve por Sidón dando un rodeo. Sana a un sordo y tartamudo: «Efata», sé abierto. Alimenta a cuatro mil con siete panes; sobran siete canastas.',
    ig:'Isaías 35:5-6: «los oídos de los sordos se abrirán… y cantará la lengua del mudo».',
    dato:'Región gentil: allí había testificado el que estuvo endemoniado.' },
  { n:'Cesarea de Filipo', ll:[33.248,35.694], via:[[32.85,35.655],[32.910,35.631]], ref:'Mateo 16:13-28', t:'«Tú eres el Cristo»',
    d:'«¿Quién decís que soy yo?». Pedro responde: «Tú eres el Cristo, el Hijo del Dios viviente». Desde entonces Jesús comienza a declarar que le es necesario ir a Jerusalén, padecer, morir y resucitar al tercer día.',
    dato:'Primer anuncio de la pasión, y primera vez que aparece la palabra «iglesia»: «edificaré mi iglesia». Es el punto de inflexión de los evangelios.',
    q:{ p:'¿Qué empezó a anunciar Jesús desde entonces?', o:['Su muerte y resurrección','La caída de Roma','El regreso a Nazaret'], r:0 } },
  { n:'Monte de la transfiguración', lb:'Transfiguración', ll:[33.416,35.857], ref:'Mateo 17:1-13', t:'Su gloria revelada',
    d:'Seis días después sube a un monte alto con Pedro, Jacobo y Juan. Su rostro resplandece como el sol; aparecen Moisés y Elías. Desde la nube: «Este es mi Hijo amado… a él oíd».',
    dato:'Hablaban de su «partida» que iba a cumplir en Jerusalén (Lc 9:31). El monte no se nombra: el Hermón es el más probable por la cercanía; la tradición señala el Tabor.' },
  { n:'Capernaum', ll:CAP, ref:'Mateo 17:22 – 18:35', t:'Últimas enseñanzas en Galilea',
    d:'Segundo anuncio de su muerte. Paga el impuesto del templo con una moneda hallada en la boca de un pez. Pone a un niño en medio: el mayor es el que se humilla. La oveja perdida y el perdón «setenta veces siete».',
    dato:'Aquí enseña cómo tratar el pecado entre hermanos (Mt 18:15-20).' },
]},

{ nombre:'Hacia Jerusalén', anio:'c. 29–30 d.C.', ref:'Lucas 9:51 – 19:27 · Juan 7–12', color:'#d9662b',
  resumen:'«Afirmó su rostro para ir a Jerusalén» (Lc 9:51). Meses de camino por Samaria, Judea y Perea, sabiendo lo que le espera.',
  paradas:[
  { n:'Capernaum', ll:CAP, ref:'Lucas 9:51', t:'Afirmó su rostro',
    d:'Cumplido el tiempo, deja Galilea definitivamente. No va arrastrado a la cruz: camina hacia ella con determinación.',
    ig:'Isaías 50:7: «puse mi rostro como un pedernal».' },
  { n:'Aldea de Samaria', lb:'Samaria', ll:GINEA, via:[[32.79,35.44]], ref:'Lucas 9:52-56', t:'No lo reciben',
    d:'Una aldea samaritana le niega hospedaje porque iba a Jerusalén. Jacobo y Juan quieren hacer descender fuego del cielo; Jesús los reprende.',
    dato:'«El Hijo del Hombre no ha venido para perder las almas de los hombres, sino para salvarlas». La ubicación es aproximada.' },
  { n:'Jerusalén', ll:TEMPLO, via:[SICAR], ref:'Juan 7–10', t:'Las fiestas y los «Yo soy»',
    d:'En la fiesta de los tabernáculos: «Si alguno tiene sed, venga a mí y beba». «Yo soy la luz del mundo». Sana a un ciego de nacimiento. «Yo soy el buen pastor; el buen pastor su vida da por las ovejas». Intentan apedrearlo.',
    dato:'«Antes que Abraham fuese, yo soy» (8:58). «Yo y el Padre uno somos» (10:30). Entendieron perfectamente lo que afirmaba.',
    q:{ p:'¿Qué da el buen pastor por las ovejas?', o:['Su tiempo','Su vida','Su manto'], r:1 } },
  { n:'Perea, al otro lado del Jordán', lb:'Perea', ll:JORDAN, via:[JERICO], ref:'Juan 10:40-42 · Lucas 15', t:'Lo perdido es hallado',
    d:'Se retira adonde Juan había bautizado, y muchos creen en él. A este período pertenecen las parábolas de la oveja perdida, la moneda perdida y el hijo pródigo.',
    dato:'Las tres parábolas responden a una murmuración: «Este a los pecadores recibe, y con ellos come».' },
  { n:'Betania', ll:BETANIA, via:[JERICO], ref:'Juan 11:1-53', t:'Lázaro, sal fuera',
    d:'Lázaro lleva cuatro días en el sepulcro. «Yo soy la resurrección y la vida». Jesús llora, manda quitar la piedra y clama a gran voz. El muerto sale.',
    dato:'Fue la gota que colmó el vaso: desde aquel día el concilio acordó matarlo. Caifás, sin saberlo, profetizó que Jesús moriría por la nación.' },
  { n:'Efraín', ll:[31.954,35.30], ref:'Juan 11:54', t:'Retiro junto al desierto',
    d:'Ya no anda abiertamente entre los judíos y se queda con sus discípulos en una ciudad apartada.' },
  { n:'Entre Samaria y Galilea', lb:'', ll:[32.47,35.33], ref:'Lucas 17:11-19', t:'Diez leprosos',
    d:'Diez leprosos le piden misericordia desde lejos y quedan limpios mientras van a mostrarse a los sacerdotes. Solo uno vuelve a dar gloria a Dios, y era samaritano.',
    dato:'«¿No son diez los que fueron limpiados? Y los nueve, ¿dónde están?»' },
  { n:'Perea', ll:[32.05,35.6], via:[[32.5,35.56]], ref:'Marcos 10:1-45', t:'Los niños y el joven rico',
    d:'Bendice a los niños. Un joven rico se va triste. Por tercera vez anuncia con detalle su muerte. Jacobo y Juan piden los primeros puestos.',
    dato:'«El Hijo del Hombre no vino para ser servido, sino para servir, y para dar su vida en rescate por muchos» (10:45).' },
  { n:'Jericó', ll:JERICO, ref:'Marcos 10:46-52 · Lucas 19:1-10', t:'Bartimeo y Zaqueo',
    d:'El ciego Bartimeo clama: «¡Hijo de David, ten misericordia de mí!» y recibe la vista. Zaqueo, jefe de los publicanos, sube a un sicómoro para verlo, y Jesús se hospeda en su casa.',
    dato:'«El Hijo del Hombre vino a buscar y a salvar lo que se había perdido». De Jericó a Jerusalén hay unos 25 km de subida y más de 1.000 m de desnivel.',
    q:{ p:'¿A qué árbol se subió Zaqueo?', o:['Una higuera','Un sicómoro','Un olivo'], r:1 } },
  { n:'Betania', ll:BETANIA, ref:'Juan 12:1-8', t:'Ungido para la sepultura',
    d:'Seis días antes de la Pascua, en una cena, María unge sus pies con una libra de nardo puro. Judas protesta por el derroche.',
    dato:'El perfume valía trescientos denarios: casi el salario de un año. «Para el día de mi sepultura ha guardado esto».' },
]},

{ nombre:'Pasión', anio:'c. 30 d.C.', ref:'Mateo 21–27 · Marcos 11–15 · Lucas 19–23 · Juan 12–19', color:'#c9264a', zoom:15,
  resumen:'La última semana, en Jerusalén. Los evangelios le dedican casi un tercio de sus páginas. Varias ubicaciones dentro de la ciudad son las tradicionales.',
  paradas:[
  { n:'Betfagé', ll:[31.777,35.250], ref:'Mateo 21:1-11', t:'Domingo: la entrada triunfal',
    d:'Montado en un pollino desciende del monte de los Olivos. La multitud tiende mantos y ramas: «¡Hosanna al Hijo de David!». Al ver la ciudad, llora sobre ella.',
    ig:'Zacarías 9:9: «He aquí tu rey vendrá a ti, justo y salvador, humilde, y cabalgando sobre un asno».',
    dato:'Muchos de los que gritaban «Hosanna» esperaban un libertador político.' },
  { n:'El templo', ll:TEMPLO, ref:'Mateo 21:12 – 23:39', t:'Lunes y martes: en el templo',
    d:'Vuelca las mesas de los cambistas: «Mi casa, casa de oración será llamada; mas vosotros la habéis hecho cueva de ladrones». Responde a las trampas sobre el tributo y la resurrección, resume la ley en dos mandamientos y pronuncia los ayes contra escribas y fariseos.',
    dato:'Ve a una viuda pobre echar dos blancas: «echó más que todos».' },
  { n:'Monte de los Olivos', ll:OLIVOS, ref:'Mateo 24–25', t:'El discurso del monte',
    d:'Sentado frente al templo anuncia que no quedará piedra sobre piedra y habla de su venida: velad, porque no sabéis el día ni la hora. Las vírgenes, los talentos, las ovejas y los cabritos.',
    dato:'El templo fue destruido por los romanos en el año 70.' },
  { n:'El aposento alto', lb:'Aposento alto', ll:APOSENTO, ref:'Lucas 22:7-38 · Juan 13–17', t:'Jueves: la última cena',
    d:'Lava los pies a sus discípulos. Anuncia la traición y Judas sale; era de noche. Toma el pan y la copa: «Esto es mi cuerpo… este es el nuevo pacto en mi sangre». Los consuela, promete el Consolador y ora por los suyos.',
    ig:'Jeremías 31:31: el nuevo pacto. Salmo 41:9: «el que de mi pan comía, alzó contra mí el calcañar».',
    dato:'«Yo soy el camino, y la verdad, y la vida» (Jn 14:6). Juan 17 es la oración más larga de Jesús que se conserva.',
    q:{ p:'¿Qué hizo Jesús antes de la cena para enseñar humildad?', o:['Lavó los pies a los discípulos','Repartió sus vestidos','Ayunó'], r:0 } },
  { n:'Getsemaní', ll:[31.7794,35.2397], ref:'Mateo 26:36-56', t:'La oración y el arresto',
    d:'«Mi alma está muy triste, hasta la muerte». Postrado ora tres veces: «no sea como yo quiero, sino como tú». Los discípulos duermen. Judas llega con una turba y lo entrega con un beso. Todos huyen.',
    ig:'Zacarías 13:7: «Hiere al pastor, y serán dispersadas las ovejas».',
    dato:'Getsemaní significa «prensa de aceite». Su sudor era como grandes gotas de sangre (Lc 22:44).' },
  { n:'Casa de Caifás', ll:[31.7713,35.2318], via:[[31.775,35.238]], ref:'Mateo 26:57-75 · Juan 18:12-27', t:'Juicio de noche y negación de Pedro',
    d:'Lo llevan primero a Anás y luego a Caifás. Los testigos falsos no concuerdan. «¿Eres tú el Cristo, el Hijo de Dios?». Ante su respuesta lo declaran reo de muerte por blasfemia, le escupen y lo golpean. En el patio, Pedro lo niega tres veces, y canta el gallo.',
    ig:'Isaías 53:7: «como cordero fue llevado al matadero… no abrió su boca». Isaías 50:6: «no escondí mi rostro de injurias y de esputos».',
    dato:'El Señor se volvió y miró a Pedro, y Pedro, saliendo fuera, lloró amargamente (Lc 22:61-62).' },
  { n:'Pretorio de Pilato', lb:'Pretorio', ll:PRETORIO, ref:'Juan 18:28-38', t:'Viernes al amanecer: ante Pilato',
    d:'Lo acusan de proclamarse rey. «Mi reino no es de este mundo». Pilato pregunta: «¿Qué es la verdad?» y declara: «Yo no hallo en él ningún delito».',
    dato:'Los acusadores no entran en el pretorio para no contaminarse y poder comer la pascua, mientras entregan a muerte al Cordero.' },
  { n:'Palacio de Herodes Antipas', lb:'Herodes', ll:[31.7765,35.2318], ref:'Lucas 23:6-12', t:'Ante Herodes',
    d:'Al saber que es galileo, Pilato lo remite a Herodes, que esperaba ver alguna señal. Jesús no le responde nada. Herodes y sus soldados lo escarnecen y lo devuelven vestido con una ropa espléndida.',
    dato:'Es el mismo Herodes que mandó decapitar a Juan el Bautista. Aquel día Pilato y Herodes se hicieron amigos.' },
  { n:'Pretorio de Pilato', lb:'', ll:PRETORIO, ref:'Juan 18:39 – 19:16', t:'«¡Crucifícale!»',
    d:'La multitud prefiere a Barrabás. Jesús es azotado, coronado de espinas y vestido de púrpura. «¡He aquí el hombre!». Pilato, tres veces convencido de su inocencia, cede y lo entrega.',
    ig:'Isaías 53:5: «herido fue por nuestras rebeliones… y por su llaga fuimos nosotros curados».',
    dato:'Barrabás, culpable de homicidio, queda libre, y el inocente muere en su lugar: es una imagen de la sustitución.',
    q:{ p:'¿A quién pidió la multitud que soltaran?', o:['A Barrabás','A Judas','A Simón de Cirene'], r:0 } },
  { n:'Gólgota', ll:GOLGOTA, via:[[31.7795,35.2315]], ref:'Juan 19:17-37 · Mateo 27:32-56', t:'La cruz',
    d:'Simón de Cirene carga la cruz. Lo crucifican entre dos malhechores; reparten sus vestidos echando suertes. «Padre, perdónalos». Al ladrón arrepentido: «Hoy estarás conmigo en el paraíso». Desde la hora sexta hasta la novena hay tinieblas. «Dios mío, Dios mío, ¿por qué me has desamparado?». «Consumado es». E inclinando la cabeza, entregó el espíritu.',
    ig:'Salmo 22:16-18: horadaron sus manos y pies, repartieron sus vestidos. Isaías 53:12: contado con los pecadores. Éxodo 12:46: no le quebraron hueso. Zacarías 12:10: mirarán al que traspasaron.',
    dato:'El velo del templo se rasgó en dos, de arriba abajo. El centurión: «Verdaderamente este era Hijo de Dios». Nadie le quitó la vida: él la puso de sí mismo (Jn 10:18).' },
  { n:'El sepulcro', lb:'Sepulcro', ll:[31.7786,35.2291], ref:'Juan 19:38-42 · Mateo 27:57-66', t:'Sepultado',
    d:'José de Arimatea, discípulo en secreto, pide el cuerpo. Con Nicodemo lo envuelve en lienzos con unas cien libras de especias y lo pone en un sepulcro nuevo, en un huerto cercano. Sellan la piedra y ponen guardia.',
    ig:'Isaías 53:9: «con los ricos fue en su muerte».',
    dato:'Los dos que lo sepultan eran miembros del concilio que lo condenó.' },
]},

{ nombre:'Resurrección', anio:'c. 30 d.C.', ref:'Mateo 28 · Lucas 24 · Juan 20–21 · Hechos 1', color:'#8e5bd0',
  resumen:'El camino no termina en la cruz. Durante cuarenta días se presenta vivo «con muchas pruebas indubitables» (Hch 1:3).',
  paradas:[
  { n:'El sepulcro vacío', lb:'Sepulcro vacío', ll:[31.7786,35.2291], ref:'Juan 20:1-18 · Mateo 28:1-10', t:'El primer día de la semana',
    d:'La piedra está removida. «No está aquí, pues ha resucitado, como dijo». Pedro y Juan corren y ven los lienzos. María Magdalena llora junto al sepulcro hasta que oye su nombre: «¡María!».',
    ig:'Salmo 16:10: «no dejarás mi alma en el Seol, ni permitirás que tu santo vea corrupción».',
    dato:'Las primeras testigos fueron mujeres, cuyo testimonio no valía en un tribunal de la época: nadie habría inventado el relato así.' },
  { n:'Emaús', ll:[31.840,35.136], ref:'Lucas 24:13-35', t:'En el camino',
    d:'Se une a dos discípulos desanimados que no lo reconocen. «Comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían». Lo reconocen al partir el pan.',
    dato:'«¿No ardía nuestro corazón en nosotros, mientras nos hablaba en el camino?». La ubicación de Emaús es debatida.',
    q:{ p:'¿Cuándo reconocieron a Jesús los de Emaús?', o:['Al oír su voz','Al partir el pan','Al ver sus manos'], r:1 } },
  { n:'Jerusalén', ll:APOSENTO, ref:'Juan 20:19-29', t:'«Paz a vosotros»',
    d:'Esa misma noche, estando las puertas cerradas, se pone en medio de los discípulos y les muestra las manos y el costado. Ocho días después, Tomás confiesa: «¡Señor mío, y Dios mío!».',
    dato:'«Bienaventurados los que no vieron, y creyeron».' },
  { n:'Mar de Galilea', ll:[32.873,35.549], via:[JERICO,[32.0,35.53],[32.5,35.56]], ref:'Juan 21', t:'«¿Me amas?»',
    d:'Tras una noche sin pescar nada, una voz desde la orilla les manda echar la red a la derecha: 153 peces grandes. Junto a las brasas, pregunta tres veces a Pedro si lo ama y tres veces le encarga: «Apacienta mis ovejas».',
    dato:'Tres negaciones junto a un fuego, tres restauraciones junto a otro.' },
  { n:'Un monte en Galilea', lb:'Gran Comisión', ll:[32.82,35.50], ref:'Mateo 28:16-20', t:'La Gran Comisión',
    d:'«Toda potestad me es dada en el cielo y en la tierra. Por tanto, id, y haced discípulos a todas las naciones, bautizándolos… enseñándoles que guarden todas las cosas que os he mandado; y he aquí yo estoy con vosotros todos los días, hasta el fin del mundo».',
    dato:'El monte no se identifica; el punto es orientativo. Lo que sigue se cuenta en Hechos, incluidos los viajes de Pablo.' },
  { n:'Monte de los Olivos', ll:OLIVOS, via:[[32.5,35.56],[32.0,35.53],JERICO], ref:'Lucas 24:50-53 · Hechos 1:3-12', t:'La ascensión',
    d:'Cuarenta días después de resucitar los lleva hasta Betania, alza las manos y los bendice. Mientras los bendice es alzado, y una nube lo oculta de sus ojos.',
    ig:'Salmo 110:1: «Siéntate a mi diestra, hasta que ponga a tus enemigos por estrado de tus pies».',
    dato:'«Este mismo Jesús… así vendrá como le habéis visto ir al cielo» (Hch 1:11).',
    q:{ p:'¿Cuántos días pasaron entre la resurrección y la ascensión?', o:['Tres','Siete','Cuarenta'], r:2 } },
]}
];
